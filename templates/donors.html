<!DOCTYPE html>
<html>
<head>
    <title>Donor History</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h1>🩸 DONOR HISTORY</h1>

<table>

<tr>
<th>ID</th>
<th>Name</th>
<th>Blood Group</th>
<th>City</th>
<th>Phone</th>
<th>Date & Time</th>
</tr>

{% for d in data %}
<tr>

<td>{{ d[0] }}</td>
<td>{{ d[1] }}</td>
<td>{{ d[2] }}</td>
<td>{{ d[3] }}</td>
<td>{{ d[4] }}</td>
<td>{{ d[5] }}</td>

</tr>
{% endfor %}

</table>

</body>
</html>
