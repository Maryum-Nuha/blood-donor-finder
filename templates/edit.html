<!DOCTYPE html>
<html>
<head>
    <title>Edit Donor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h1>✏ Edit Donor</h1>

<div class="card">

<form method="POST">

<input type="text" name="name" value="{{ donor[1] }}" required>

<select name="blood_group">

<option {% if donor[2]=='A+' %}selected{% endif %}>A+</option>
<option {% if donor[2]=='A-' %}selected{% endif %}>A-</option>
<option {% if donor[2]=='B+' %}selected{% endif %}>B+</option>
<option {% if donor[2]=='B-' %}selected{% endif %}>B-</option>
<option {% if donor[2]=='O+' %}selected{% endif %}>O+</option>
<option {% if donor[2]=='O-' %}selected{% endif %}>O-</option>
<option {% if donor[2]=='AB+' %}selected{% endif %}>AB+</option>
<option {% if donor[2]=='AB-' %}selected{% endif %}>AB-</option>

</select>

<input type="text" name="city" value="{{ donor[3] }}" required>

<input type="text" name="phone" value="{{ donor[4] }}" required>

<button>Update Donor</button>

</form>

</div>

</body>
</html>
