<!DOCTYPE html>
<html>
<head>
    <title>Search Donor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h1>🔍 SEARCH DONOR</h1>

<div class="card">

<form method="POST">

<select name="blood_group">

<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>O+</option>
<option>O-</option>
<option>AB+</option>
<option>AB-</option>

</select>

<button>Search</button>

</form>

</div>

<h2>{{ message }}</h2>

{% if data %}

<table>

<tr>
<th>Name</th>
<th>Blood Group</th>
<th>City</th>
<th>Phone</th>
<th>Date & Time</th>
</tr>

{% for d in data %}
<tr>

<td>{{ d[1] }}</td>
<td>{{ d[2] }}</td>
<td>{{ d[3] }}</td>
<td>{{ d[4] }}</td>
<td>{{ d[5] }}</td>

</tr>
{% endfor %}

</table>

{% endif %}

</body>
</html>
